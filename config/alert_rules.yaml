alerts:
  - name: high_latency_slo_breach
    severity: critical
    condition: latency_p95_ms > 3000
    duration: 10m
    type: symptom-based
    channel: slack
    owner: platform-oncall
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: api-oncall
    runbook: docs/alerts.md#alert-2
  - name: retrieval_success_degraded
    severity: warning
    condition: retrieval_success_rate_pct < 90
    duration: 10m
    type: symptom-based
    channel: slack
    owner: rag-oncall
    runbook: docs/alerts.md#alert-3
